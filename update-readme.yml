name: Update README

on:
  schedule:
    # 05:00 UTC — 07:00 Europe/Athens in winter, 08:00 in summer
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: update-readme
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-now:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh Now section
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update-now.py

      - name: Commit and push if the Now section changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes"
            exit 0
          fi
          git commit -m "chore: refresh Now section from Reach Panel releases"
          git push
